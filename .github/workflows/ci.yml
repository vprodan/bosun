name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hygiene:
    name: Changed active-source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      product-changes: ${{ steps.changed-paths.outputs.product-changes }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths and check active-source whitespace
        id: changed-paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only a known push/PR range can authorize skipping qualification.
          comparable=false
          base=
          tip=$GITHUB_SHA
          if [[ "$EVENT_NAME" == pull_request && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            if base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
              tip=$PR_HEAD_SHA
              comparable=true
            fi
          elif [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" && git cat-file -e "$GITHUB_SHA^{commit}"; then
              base=$BEFORE_SHA
              comparable=true
            fi
          fi
          if [[ "$comparable" != true ]]; then
            # Unknown ranges still receive hygiene and full qualification.
            tip=$GITHUB_SHA
            if ! base=$(git rev-parse --verify "$tip^" 2>/dev/null); then
              base=$(git hash-object -t tree /dev/null)
            fi
          fi

          product_changes=true
          paths=$(mktemp)
          trap 'rm -f "$paths"' EXIT
          # A file, rather than process substitution, preserves diff failure.
          # Disabling renames checks both sides of moves, including deletions.
          if [[ "$comparable" == true ]] && git diff --no-renames --name-only -z "$base" "$tip" -- >"$paths"; then
            product_changes=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|AGENTS.md|CONTRIBUTING.md|ARCHITECTURE.md) ;;
                docs/licenses|docs/licenses/*) product_changes=true; break ;;
                docs/*.md) ;;
                *) product_changes=true; break ;;
              esac
            done <"$paths"
          fi
          printf 'product-changes=%s\n' "$product_changes" >>"$GITHUB_OUTPUT"
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab diff --check "$base" "$tip" -- \
            src scripts test bin .github roles skills \
            package.json bun.lock tsconfig.json install.sh policy.md

  qualified-shards:
    name: Guarded source shard ${{ matrix.shard }}/4
    needs: source-hygiene
    if: ${{ needs.source-hygiene.result == 'success' && needs.source-hygiene.outputs.product-changes != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Documentation-only pushes never enter these qualification groups.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-shard-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: true
      - name: Prepare and qualify this runner's fresh native inputs
        uses: ./.github/actions/prepare-qualified-bun
      - name: Run this isolated guarded source shard
        shell: bash
        run: sh scripts/bun-check.sh tests --runtime bun --suite all --shard "${{ matrix.shard }}/4"

  qualified-checks:
    name: Hosted macOS arm64 qualification and full checks
    needs: [source-hygiene, qualified-shards]
    if: ${{ always() && needs.source-hygiene.result == 'success' && needs.source-hygiene.outputs.product-changes != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualified shard to succeed
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.qualified-shards.result }}
        run: test "$SHARD_RESULT" = success
