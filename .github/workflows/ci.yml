name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    name: Changed active-source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed active paths for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
            tip=$PR_HEAD_SHA
          elif [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base=$BEFORE_SHA
            tip=$GITHUB_SHA
          else
            # A new branch/manual dispatch checks the latest commit, not historical evidence.
            tip=$GITHUB_SHA
            if git rev-parse --verify "$tip^" >/dev/null 2>&1; then
              base=$(git rev-parse "$tip^")
            else
              base=$(git hash-object -t tree /dev/null)
            fi
          fi
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab diff --check "$base" "$tip" -- \
            src scripts test bin .github roles skills \
            package.json bun.lock tsconfig.json install.sh policy.md

  qualified-checks:
    name: Hosted macOS arm64 qualification and full checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: true
      - name: Prepare fresh qualified inputs and run guarded checks
        uses: ./.github/actions/prepare-qualified-bun
